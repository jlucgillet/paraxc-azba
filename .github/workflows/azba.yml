name: Activations RTBA (SIA) → ParaXC

on:
  # Toutes les 30 min de 05h07 à 19h37 UTC
  # (soit ~7h–21h30 en heure d'été, ~6h–20h30 en heure d'hiver).
  # GitHub peut décaler les lancements programmés de quelques minutes.
  schedule:
    - cron: '7,37 5-19 * * *'
  # Bouton « Run workflow » pour lancer à la main (test)
  workflow_dispatch:

# Nécessaire pour publier les données sur la branche « data »
permissions:
  contents: write

concurrency:
  group: azba
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04   # version figée : évite le passage automatique à Ubuntu 26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Cache du navigateur Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dépendances système de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Récupérer les activations sur la carte du SIA
        env:
          # Facultatif : envoi direct en plus de la publication (laisser vide si
          # l'hébergeur bloque GitHub). Sans ces secrets, rien n'est envoyé.
          PARAXC_UPLOAD_URL: ${{ secrets.PARAXC_UPLOAD_URL }}
          PARAXC_UPLOAD_KEY: ${{ secrets.PARAXC_UPLOAD_KEY }}
        run: node scrape_azba.mjs

      # Publication sur la branche « data » : un seul commit, remplacé à chaque
      # lancement (le dépôt ne grossit pas). ParaXC_backend.php lit ensuite :
      # https://raw.githubusercontent.com/<compte>/<dépôt>/data/rtba.json
      - name: Publier les données (branche data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pub && cp rtba.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rtba.json
          git commit -q -m "Activations RTBA $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "📡 Données publiées : https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/rtba.json"

      - name: Capture d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sia
          path: debug/
          retention-days: 5
          if-no-files-found: ignore
